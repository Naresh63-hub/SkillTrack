<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SkillTrack — Track technical skills, certifications, projects, daily tasks, and placement preparation in one place.">
  <meta name="theme-color" content="#10091F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkillTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SkillTrack — Student Skills & Placement Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #10091F;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      color: #FFFFFF;
      background: radial-gradient(circle at center, #170D35 0%, #10091F 100%);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(139, 92, 246, 0.2);
      border-radius: 50%;
      border-top-color: #8B5CF6;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      margin-top: 18px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: #A69ABD;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="title">SkillTrack</div>
    <div class="subtitle">Build Skills • Track Progress • Get Placement Ready</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
