<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SkillTrack — Track technical skills, certifications, projects, daily tasks, and placement preparation in one place.">
  <meta name="theme-color" content="#100B16">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkillTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SkillTrack — Student Skills & Placement Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #100B16;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      color: #FFFFFF;
      background: radial-gradient(circle at center, #1C1722 0%, #100B16 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-box {
      filter: drop-shadow(0 0 24px rgba(139, 92, 246, 0.45));
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.92; }
    }
    .title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #FFFFFF;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: #B8B3C2;
    }
    .progress-bar-container {
      margin-top: 24px;
      width: 140px;
      height: 3.5px;
      background: rgba(139, 92, 246, 0.18);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-inner {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #8B5CF6, #C084FC);
      border-radius: 999px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-box">
      <svg class="logo-svg" viewBox="0 0 100 100" width="78" height="78">
        <defs>
          <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#A78BFA"/>
            <stop offset="50%" stop-color="#C084FC"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>
        <!-- Card background -->
        <rect x="6" y="6" width="88" height="88" rx="22" fill="#1C1722" stroke="#8B5CF6" stroke-width="2.5" stroke-opacity="0.5"/>
        <!-- Stylized "S" Lightning Bolt matching SkillTrack brand -->
        <polygon points="32,20 74,20 50,46 72,46 32,80 44,53 32,53" fill="url(#boltGrad)" filter="url(#glow)"/>
      </svg>
    </div>
    <div class="title">SkillTrack</div>
    <div class="subtitle">Build Skills • Track Progress • Get Placement Ready</div>
    <div class="progress-bar-container">
      <div class="progress-bar-inner"></div>
    </div>
  </div>
  <script>
    // Smooth fade out when Flutter first frame is painted
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease-out';
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    });
    // PWA Install Prompt Capture
    window.deferredPWAInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa_prompt_available'));
      console.log('SkillTrack: PWA install prompt ready.');
    });
    window.triggerPWAInstall = function() {
      if (window.deferredPWAInstallPrompt) {
        window.deferredPWAInstallPrompt.prompt();
        window.deferredPWAInstallPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            console.log('SkillTrack: PWA installation accepted.');
          }
          window.deferredPWAInstallPrompt = null;
        });
        return true;
      }
      return false;
    };
    window.isPWAStandalone = function() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
