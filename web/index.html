<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SkillTrack — Track technical skills, certifications, projects, daily tasks, and placement preparation in one place.">
  <meta name="theme-color" content="#100B16">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkillTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SkillTrack — Student Skills & Placement Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #100B16;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      color: #FFFFFF;
      background: radial-gradient(circle at center, #1C1722 0%, #100B16 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-box {
      filter: drop-shadow(0 0 24px rgba(139, 92, 246, 0.45));
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.92; }
    }
    .title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #FFFFFF;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: #B8B3C2;
    }
    .progress-bar-container {
      margin-top: 24px;
      width: 140px;
      height: 3.5px;
      background: rgba(139, 92, 246, 0.18);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-inner {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #8B5CF6, #C084FC);
      border-radius: 999px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-box">
      <img src="icons/Icon-192.png" width="96" height="96" alt="SkillTrack Logo" style="border-radius: 24px; box-shadow: 0 0 32px rgba(139, 92, 246, 0.45); border: 1.5px solid rgba(139, 92, 246, 0.4);" />
    </div>
    <div class="title">SkillTrack</div>
    <div class="subtitle">Build Skills • Track Progress • Get Placement Ready</div>
    <div class="progress-bar-container">
      <div class="progress-bar-inner"></div>
    </div>
  </div>
  <script>
    // Smooth fade out when Flutter first frame is painted
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.transition = 'opacity 0.2s ease-out';
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 200);
      }
    });
    // PWA Install Prompt Capture
    window.deferredPWAInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa_prompt_available'));
      console.log('SkillTrack: PWA install prompt ready.');
    });
    window.triggerPWAInstall = function() {
      if (window.deferredPWAInstallPrompt) {
        window.deferredPWAInstallPrompt.prompt();
        window.deferredPWAInstallPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            console.log('SkillTrack: PWA installation accepted.');
          }
          window.deferredPWAInstallPrompt = null;
        });
        return true;
      }
      return false;
    };
    window.isPWAStandalone = function() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    };
    window.downloadFileFromDataUrl = function(dataUrl, fileName) {
      try {
        var a = document.createElement('a');
        if (dataUrl.indexOf('data:') === 0) {
          var arr = dataUrl.split(',');
          var mimeMatch = arr[0].match(/:(.*?);/);
          var mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
          var bstr = atob(arr[1]);
          var n = bstr.length;
          var u8arr = new Uint8Array(n);
          while (n--) {
            u8arr[n] = bstr.charCodeAt(n);
          }
          var blob = new Blob([u8arr], { type: mime });
          var blobUrl = URL.createObjectURL(blob);
          a.href = blobUrl;
          a.download = fileName || 'document';
          document.body.appendChild(a);
          a.click();
          setTimeout(function() {
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
          }, 1500);
          return true;
        } else {
          a.href = dataUrl;
          a.download = fileName || 'document';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          return true;
        }
      } catch (e) {
        console.error('Download error:', e);
        return false;
      }
    };
    window.shareFileFromDataUrl = async function(dataUrl, fileName, title, text) {
      try {
        if (!navigator.canShare) return false;
        var arr = dataUrl.split(',');
        var mimeMatch = arr[0].match(/:(.*?);/);
        var mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
        var bstr = atob(arr[1]);
        var n = bstr.length;
        var u8arr = new Uint8Array(n);
        while (n--) {
          u8arr[n] = bstr.charCodeAt(n);
        }
        var blob = new Blob([u8arr], { type: mime });
        var file = new File([blob], fileName || 'document.pdf', { type: mime });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: title || fileName || 'Document',
            text: text || ''
          });
          return true;
        }
      } catch (e) {
        console.warn('Web file share error or dismissed:', e);
      }
      return false;
    };
    window.openFileInNewTab = function(dataUrl) {
      try {
        if (dataUrl.indexOf('data:') === 0) {
          var arr = dataUrl.split(',');
          var mimeMatch = arr[0].match(/:(.*?);/);
          var mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
          var bstr = atob(arr[1]);
          var n = bstr.length;
          var u8arr = new Uint8Array(n);
          while (n--) {
            u8arr[n] = bstr.charCodeAt(n);
          }
          var blob = new Blob([u8arr], { type: mime });
          var blobUrl = URL.createObjectURL(blob);
          window.open(blobUrl, '_blank');
          return true;
        } else {
          window.open(dataUrl, '_blank');
          return true;
        }
      } catch (e) {
        console.error('Open file error:', e);
        return false;
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script type="text/javascript">
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
