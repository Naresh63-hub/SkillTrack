name: skilltrack
description: "SkillTrack — Student Skills & Placement Tracker. A comprehensive offline-first career development Flutter application for college students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local Persistence
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.4

  # File & Path handling
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  image_picker: ^1.1.2

  # Analytics & Visualization
  fl_chart: ^0.70.2

  # Resume PDF Generation & Preview
  pdf: ^3.11.3
  printing: ^5.14.2

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Utilities & External Launchers
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

dependency_overrides:
  archive: ^4.5.2

flutter:
  uses-material-design: true
